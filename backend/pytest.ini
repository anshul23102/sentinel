[pytest]
asyncio_mode = auto
testpaths = tests
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
# A bound of last resort — a test that hangs (e.g. a saturated connection
# pool waiting on pool.acquire() with no caller-side timeout) should fail
# loudly after two minutes, not hang the whole CI job until it's manually
# cancelled or hits GitHub Actions' own much longer default job timeout.
timeout = 120
