services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      # Vite inlines VITE_* values into the built bundle at build time, not
      # at container runtime — an `environment:` entry here would have no
      # effect on the static files nginx serves, so it has to be a build arg.
      args:
        VITE_BACKEND_URL: http://localhost:8000
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: unless-stopped
