name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install "ruff==0.15.22"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest tests/ -v
        env:
          GROQ_API_KEY: ""
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sentinel_test
          REDIS_URL: redis://localhost:6379/1

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker:
    name: Docker (compose smoke test)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and start the full stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Smoke test the running stack
        run: |
          set -e
          curl -fsS http://localhost:8000/readyz
          echo
          # frontend is served by nginx and must be the built SPA
          curl -fsS http://localhost:8080/ | grep -qi "sentinel"
          # a real log batch goes through the full pipeline into Postgres/Redis
          curl -fsS -X POST http://localhost:8000/api/ingest \
            -H "Content-Type: application/json" \
            -H "X-Session-Id: live-ci-smoke" \
            -d '{"logs":[{"endpoint":"/api/ci","status_code":200,"latency_ms":42.0}]}'
          echo
          curl -fsS http://localhost:8000/api/health -H "X-Session-Id: live-ci-smoke" | grep -q '"/api/ci"'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
